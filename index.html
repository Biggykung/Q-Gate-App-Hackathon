<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Quest Health Gate</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-white p-4 md:p-8">
    <div class="max-w-3xl mx-auto space-y-6">

        <!--Header-->
        <header class="bg-indigo-600 text-white p-6 rounded-2xl shadow-md text-center">
            <h1 class="text-2xl font-bold tracking-tight">Quantum Quest Health Gate</h1>
            <p class="text-white text-sm mt-1">ระบบคัดกรองสุขภาพเเละวิเคราะห์ความเสี่ยงอัตโนมัติด้วย AI</p>
        
            <a href="dashboard.html" class="mt-5 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm border border-white/10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                ดู Referral Queue
            </a>
        </header>

        <!-- ขั้นตอนที่ 1: ลงทะเบียนคนไข้ -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
                <span class="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>
                ลงทะเบียนคนไข้ใหม่
            </h2>
            <form id="patientForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="name" required class="w-full bg-white text-slate-900 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="สมชาย ใจดี">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">อายุ (ปี)</label>
                    <input type="number" id="age" required class="w-full bg-white text-slate-900 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="45">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">น้ำหนัก (กก.)</label>
                    <input type="number" step="0.1" id="weight" required class="w-full bg-white text-slate-900 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="70.5">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">โรคประจำตัว</label> 
                    <input type="text" id="disease" class="w-full bg-white text-slate-900 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="ความดัน, เบาหวาน (ถ้ามี)">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-600 mb-1">สิทธิการรักษา/กองทุน</label>
                    <input type="text" id="fund" required class="w-full bg-white text-slate-900 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="ประกันสังคม / บัตรทอง">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition">บันทึกข้อมูลคนไข้</button>
                </div>
            </form>
            <div id="patientStatus" class="mt-3 text-sm font-medium"></div>
        </section>

        <!-- ขั้นตอนที่ 2: บันทึกผลตรวจสุขภาพ -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
                <span class="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>
                บันทึกผลการตรวจสุขภาพ (Screening)
            </h2>
            <form id="screeningForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">รหัสคนไข้ (Patient ID)</label>
                    <input type="number" id="screen_patient_id" readonly required class="w-full bg-slate-100 text-slate-900 border border-slate-300 rounded-lg p-2.5 text-sm cursor-not-allowed" placeholder="รอลงทะเบียนในขั้นตอนที่ 1">                           
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">ระดับน้ำตาลในเลือด (mg/dL)</label>
                    <input type="number" step="0.1" id="blood_sugar" required class="w-full bg-white text-slate-900 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="120.5">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">ความดันโลหิต (SYS/DIA)</label>
                    <input type="text" id="blood_pressure" required class="w-full bg-white text-slate-900 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="120/80">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">ค่า UACR (mg/g)</label>
                    <input type="number" step="0.1" id="qcard_risk" required class="w-full bg-white text-slate-900 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="เช่น 45 หรือ 350">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition">บันทึกผลตรวจ</button>
                </div>
            </form>
            <div id="screeningStatus" class="mt-3 text-sm font-medium"></div>
        </section>
        <!-- ขั้นตอนที่ 3: สร้าง AI วิเคราะห์ผล -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold text-slate-700 mb-2 flex items-center gap-2">
                <span class="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">3</span>
                วิเคราะห์ผลสุขภาพด้วย AI
            </h2>
            <p class="text-xs text-slate-500 mb-4">ดึงข้อมูลผลตรวจล่าสุดของคนไข้ส่งให้ AI ประมวลผลเเละสร้างเเนวทางการดูเเลสุขภาพ</p>
            <button id="analyzeBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg text-sm transition flex items-center justify-center gap-2">
                เริ่มการวิเคราะห์ด้วย AI   
            </button>

            <!--พื้นที่เเสดงผลการวิเคราะห์-->
            <div id="aiResultContainer" class="hidden mt-6 p-5 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                <h3 class="font-semibold text-slate-800 text-sm">ผลการวิเคราะห์เเละข้อเเนะนำ</h3>
                <div id="aiResultText" class="text-sm text-slate-700 leading-relaxed font-sans"></div>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
